<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document Assistant</title>
    <style>
        :root {
            --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
            --border: #e3e6eb; --accent: #2563eb; --accent-text: #ffffff;
            --user-bubble: #2563eb; --bot-bubble: #eef1f5; --error: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12151b; --panel: #1a1e26; --text: #e5e7eb; --muted: #9ca3af;
                --border: #2a2f3a; --accent: #3b82f6; --accent-text: #ffffff;
                --user-bubble: #2563eb; --bot-bubble: #252b36; --error: #f87171;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
        }
        header {
            padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        }
        header h1 { font-size: 17px; margin: 0; }
        .upload { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
        .upload label {
            border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
            cursor: pointer; color: var(--text); background: var(--bg);
        }
        .upload input { display: none; }
        main {
            flex: 1; overflow-y: auto; padding: 20px 16px;
            display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto;
        }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--user-bubble); color: var(--accent-text); }
        .bot { align-self: flex-start; background: var(--bot-bubble); }
        .bot.error { color: var(--error); }
        .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
        form {
            display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
            background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto;
        }
        textarea {
            flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
            font: inherit; background: var(--bg); color: var(--text); height: 46px;
        }
        button {
            border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent);
            color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: default; }
        select {
            border: 1px solid var(--border); border-radius: 10px; padding: 0 10px;
            font: inherit; background: var(--bg); color: var(--text);
        }
    </style>
</head>
<body>
<header>
    <h1>Document Assistant</h1>
    <div class="upload">
        <span id="uploadStatus"></span>
        <label>Upload PDF<input type="file" id="fileInput" accept="application/pdf"></label>
    </div>
</header>

<main id="messages">
    <p class="empty" id="empty">Ask a question about your documents.</p>
</main>

<form id="chatForm">
    <select id="provider" aria-label="Model provider"></select>
    <textarea id="question" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)" required></textarea>
    <button type="submit" id="sendBtn">Send</button>
</form>

<script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('question');
    const sendBtn = document.getElementById('sendBtn');
    const providerSelect = document.getElementById('provider');
    const providerLabels = { OPENAI: 'OpenAI', GEMINI: 'Gemini' };

    // Show only the providers the server has enabled; hide the dropdown if there's just one.
    fetch('/api/chat/providers')
        .then(res => res.json())
        .then(list => {
            list.forEach(p => providerSelect.add(new Option(providerLabels[p] ?? p, p)));
            providerSelect.hidden = list.length < 2;
        })
        .catch(() => { providerSelect.hidden = true; });

    function addMessage(text, cls) {
        document.getElementById('empty')?.remove();
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;
        addMessage(question, 'user');
        input.value = '';
        sendBtn.disabled = true;
        const pending = addMessage('Thinking…', 'bot');
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, provider: providerSelect.value || null })
            });
            const data = await res.json();
            pending.textContent = data.answer ?? 'No answer returned.';
            if (!res.ok) pending.classList.add('error');
        } catch (err) {
            pending.textContent = 'Request failed: ' + err.message;
            pending.classList.add('error');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            form.requestSubmit();
        }
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const status = document.getElementById('uploadStatus');
        status.textContent = 'Uploading ' + file.name + '…';
        const body = new FormData();
        body.append('file', file);
        try {
            const res = await fetch('/api/documents', { method: 'POST', body });
            const data = await res.json();
            status.textContent = res.ok
                ? `Added ${data.file} (${data.chunks} chunks)`
                : (data.error || 'Upload failed');
        } catch (err) {
            status.textContent = 'Upload failed: ' + err.message;
        }
        e.target.value = '';
    });
</script>
</body>
</html>
