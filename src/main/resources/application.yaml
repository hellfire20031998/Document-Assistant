spring:
  application:
    name: DocumentAssistant

  # Load secrets from .env in the project root (KEY=value lines). Optional, so the app
  # still starts when the variables are set in the real environment instead.
  config:
    import: optional:file:.env[.properties]

  # Database connection is supplied automatically by spring-boot-docker-compose
  # from compose.yaml (pgvector service). Uncomment to run against your own Postgres.
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/mydatabase
  #   username: myuser
  #   password: secret

  jpa:
    # vector_store is created and written by Spring AI's PgVectorStore; Hibernate must never alter it
    hibernate:
      ddl-auto: none
    open-in-view: false

  docker:
    compose:
      lifecycle-management: start-only

  # Gemini is the default provider. OpenAI is OFF unless the "openai" profile is active:
  #   SPRING_PROFILES_ACTIVE=openai  and  OPENAI_API_KEY in .env   (see application-openai.yaml)
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  ai:
    # Chat: every enabled provider gets a chat model; ChatController picks one per request.
    # Embeddings: only ONE provider may embed (the vector store needs a single, consistent model).
    # EMBEDDING_PROVIDER = transformers (default: local ONNX model, no key, no rate limits)
    #                    | google-genai | openai (openai needs the openai profile)
    # After switching: set vectorstore.pgvector.dimensions to the model's size (transformers 384,
    # gemini/openai 768) and DROP the vector_store table so it is recreated and re-embedded.
    model:
      embedding: ${EMBEDDING_PROVIDER:transformers}        # read by the Transformers and OpenAI starters
      embedding.text: ${EMBEDDING_PROVIDER:transformers}   # read by the Gemini starter
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    chat:
      client:
        enabled: false   # ChatClients are built per provider in AiConfig

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash
            temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768

    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 768

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:384}   # must match the embedding model (transformers 384, gemini/openai 768)
        table-name: vector_store
        max-document-batch-size: 1000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Document loading. The local model has no rate limits, so there's no pause by default.
# For a cloud embedding provider on a free tier, use a pause of ~60000 to stay under per-minute quotas.
app:
  ingest:
    batch-size: 50          # chunks embedded per batch
    pause-ms: ${INGEST_PAUSE_MS:0}   # wait between batches
    max-retries: 5          # retries per batch on rate-limit / transient errors

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor: DEBUG
